[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"

# The app lives at /app (the homepage is /). Serve the single-page app for those paths.
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or phones keep running an old one after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

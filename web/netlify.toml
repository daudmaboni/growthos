[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"

# The app lives at /app (the homepage is /). Serve the single-page app for those paths.
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or phones keep running an old one after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Security headers for every page (21 Nov 2026).
# - frame-ancestors / X-Frame-Options: no other site may show itaOS inside a frame (stops click-tricks).
# - HSTS: browsers always use HTTPS for itaos.app.
# - nosniff, Referrer-Policy, Permissions-Policy: standard hardening; camera/mic/location are off
#   because itaOS doesn't use them.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
